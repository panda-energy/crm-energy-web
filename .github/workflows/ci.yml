# Web CI -- crm-energy-web
#
# Pipeline: lint -> typecheck -> test -> build -> storybook (parallel where possible)
# Target: <8 min total. Cache pnpm store.
# D-2.5: Workflow frontend web
# D-2.4: Vercel PR previews are handled by the Vercel GitHub App (built-in).
#         No workflow needed -- previews are created automatically on every PR.

name: web-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.1.3"

jobs:
  lint:
    name: ci/lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: ci/typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: ci/test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --coverage
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage/coverage-final.json
          flags: web
          fail_ci_if_error: false

  audit:
    name: ci/pnpm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true # Alert, don't block (D-4.7)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        run: |
          pnpm audit --audit-level=high --json > pnpm-audit-report.json 2>&1 || echo "Vulnerabilities found (non-blocking)"
          pnpm audit --audit-level=high || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnpm-audit-report
          path: pnpm-audit-report.json
          retention-days: 30

  build:
    name: ci/build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck]
    env:
      # Dummy values for build -- Vercel injects real ones during deploy
      NEXT_PUBLIC_API_URL: https://api-staging.example.invalid
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_BUILD_ONLY
      NEXT_PUBLIC_API_MOCKING: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  storybook:
    name: ci/storybook
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook
